<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Probe</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Supabase Probe</h1>
      <p class="subtitle">Self-hosted DB connectivity check</p>

      <div class="status-row">
        <span>Application</span>
        <strong id="app-status">-</strong>
      </div>

      <div class="status-row">
        <span>Database</span>
        <strong id="db-status">-</strong>
      </div>

      <div class="status-row">
        <span>Latency</span>
        <strong id="latency">-</strong>
      </div>

      <div class="status-row">
        <span>Checked at</span>
        <strong id="checked-at">-</strong>
      </div>

      <p id="error" class="error hidden"></p>
      <button id="refresh-btn" type="button">Refresh</button>
    </main>

    <script src="/app.js" defer></script>
  </body>
  </html>
